name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      - run: pnpm exec biome ci
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm api:check
      - run: pnpm compat:check
      - run: pnpm --filter demo typecheck
      - run: pnpm --filter demo build
      - run: pnpm lint:package
      - run: pnpm size
      - run: pnpm --filter demo exec playwright install --with-deps chromium
      - run: pnpm --filter demo e2e

  react-18:
    name: Tests on React 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      # Swaps the lowest supported React in on the runner only. The lockfile
      # stays on React 19 (ADR 0080).
      - name: Install React 18
        run: pnpm add -D -w react@18.3.1 react-dom@18.3.1 @types/react@18.3.31 @types/react-dom@18.3.7
      - run: pnpm test
