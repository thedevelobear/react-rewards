<!doctype html>
<html lang="en">
  <head>
    <meta
      name="description"
      content="Reward micro-interactions for React: confetti, emoji, balloons and fireworks."
    />
    <link rel="canonical" href="https://thedevelobear.github.io/react-rewards/" />
    <!-- Rsbuild adds the SVG favicon. -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Link previews. Their URLs are absolute, because crawlers need them so. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="react-rewards" />
    <meta property="og:title" content="react-rewards" />
    <meta
      property="og:description"
      content="Reward micro-interactions for React: confetti, emoji, balloons and fireworks."
    />
    <meta property="og:url" content="https://thedevelobear.github.io/react-rewards/" />
    <meta
      property="og:image"
      content="https://thedevelobear.github.io/react-rewards/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="react-rewards: reward micro-interactions for React. Confetti, emoji, balloons and fireworks."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The browser's bar, in each theme's --bg. useTheme follows a chosen theme. -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0a0a0b"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      // Applies the stored theme before the first paint, so the page never
      // shows the other theme first. "system" stores nothing. The key is the
      // one useTheme writes.
      try {
        const theme = localStorage.getItem('react-rewards:theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        // Storage is blocked, so the system theme applies.
      }
    </script>
  </head>
  <body>
    <div id="<%= mountId %>"></div>
  </body>
</html>
